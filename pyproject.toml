[project]
name = "backend-core-api"
version = "0.1.0"
description = "FastAPI Core API Service for Virtual Shelf & Book Management"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "sqlalchemy>=2.0.28,<3.0.0",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "alembic>=1.13.1,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pyjwt[crypto]>=2.8.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20.0,<1.0.0",
    "pytest>=8.1.0,<9.0.0",
    "pytest-asyncio>=0.23.5,<1.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
asyncio_mode = "auto"
testpaths = [
    "tests",
]
pythonpath = [
    "."
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "UP042", "UP046"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["prop-decorator", "assignment", "arg-type", "union-attr"]

