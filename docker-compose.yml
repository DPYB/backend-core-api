version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virtual-shelf-book-api
    ports:
      - "8000:8000"
    volumes:
      # 로컬 소스코드 핫리로드 볼륨 마운트
      - ./app:/app/app
      - ./alembic:/app/alembic
    env_file:
      - .env
    environment:
      - PORT=8000
    # 로컬 개발 시 --reload 플래그 활성화
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
